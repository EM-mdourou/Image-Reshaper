<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Reshaper History</title><style>
:root{--green:#9ABB35;--line:#dedfd9;--muted:#6d6d6d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111;border-top:4px solid var(--green)}main{max-width:1380px;margin:auto;padding:28px 34px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:26px}h1{margin:0;font-size:24px}.back{color:#536500;text-decoration:none;border:1px solid #9fba42;border-radius:9px;padding:9px 12px;font-weight:800}.sub{color:var(--muted);margin:6px 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.item{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.thumb{height:180px;background:#f2f4ee;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{max-width:100%;max-height:100%;display:block}.meta{font-size:12px;color:#555;margin-top:10px;line-height:1.5}.meta b{color:#111}.instruction{white-space:pre-wrap;margin-top:7px;color:#333}.empty{padding:30px;border:1px dashed #bbb;border-radius:14px;color:#666}.topmeta{font-size:12px;color:#666}@media(max-width:650px){main{padding:20px 16px}header{align-items:flex-start;flex-direction:column}}</style></head><body><main><header><div><h1>Usage History</h1><p class="sub">Successful Image Reshaper runs, newest first.</p></div><div><span id="who" class="topmeta"></span> <a class="back" href="/">← Back to Reshaper</a></div></header><div id="list" class="grid"><div class="empty">Loading history…</div></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{const me=await fetch('/api/auth/me');if(!me.ok){location='/login.html';return}const mj=await me.json();document.getElementById('who').textContent='Signed in as '+mj.username;const r=await fetch('/api/history?limit=300');const j=await r.json();if(!r.ok)throw Error(j.error||'Could not load history');const list=document.getElementById('list');if(!j.items?.length){list.innerHTML='<div class="empty">No successful runs have been recorded yet.</div>';return}list.innerHTML=j.items.map(x=>`<article class="item"><div class="thumb">${x.thumbnail_data_url?`<img src="${x.thumbnail_data_url}" alt="Generated thumbnail">`:'No thumbnail'}</div><div class="meta"><b>${esc(x.action)}</b> · ${esc(x.destination_name||'Custom')} ${x.width&&x.height?`(${x.width} × ${x.height})`:''}<br>${new Date(x.created_at).toLocaleString()} · user: <b>${esc(x.username)}</b>${x.source_filename?`<br>Source: ${esc(x.source_filename)}`:''}${x.instructions?`<div class="instruction"><b>Instructions:</b> ${esc(x.instructions)}</div>`:''}</div></article>`).join('');}catch(e){document.getElementById('list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}})();
</script></body></html>
