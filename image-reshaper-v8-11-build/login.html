<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Reshaper · Sign in</title>
<style>
:root{--green:#9ABB35;--ink:#111;--muted:#707070;--line:#dfe1d8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f6f8ef,#fff);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}
body:before{content:"";position:fixed;top:0;left:0;right:0;height:5px;background:var(--green)}
.card{width:min(430px,calc(100vw - 32px));background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 16px 50px #00000012}
.logo{width:180px;max-width:70%;height:auto;display:block;margin-bottom:24px}
h1{font-size:26px;margin:0 0 7px}p{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 24px}
label{display:block;font-size:12px;font-weight:800;margin:13px 0 6px}
input{width:100%;border:1px solid #d8dad2;border-radius:10px;padding:12px 13px;font:14px inherit;outline:none}input:focus{border-color:var(--green);box-shadow:0 0 0 3px #9abb3520}
button{width:100%;border:0;border-radius:10px;background:var(--green);padding:13px 16px;margin-top:20px;font-weight:850;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
.error{display:none;margin-top:13px;padding:10px 12px;border-radius:9px;background:#fff0ee;color:#9b3d31;font-size:12px}
.foot{margin-top:18px;text-align:center;color:#999;font-size:11px}
</style>
</head>
<body>
<form id="loginForm" class="card" autocomplete="on">
  <img class="logo" src="/assets/muslim-link-logo.png" alt="Muslim Link">
  <h1>Image Reshaper</h1>
  <p>Sign in to access the image reshaping workspace.</p>
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button id="submitBtn" type="submit">Sign in</button>
  <div id="error" class="error"></div>
  <div class="foot">Secure account access</div>
</form>
<script>
(async()=>{try{const r=await fetch('/api/auth/me');if(r.ok)location.replace('/');}catch{}})();
const form=document.getElementById('loginForm'),btn=document.getElementById('submitBtn'),err=document.getElementById('error');
form.addEventListener('submit',async e=>{
  e.preventDefault();err.style.display='none';btn.disabled=true;btn.textContent='Signing in…';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:form.username.value,password:form.password.value})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||'Sign in failed');
    location.replace('/');
  }catch(e){err.textContent=e.message;err.style.display='block';}
  finally{btn.disabled=false;btn.textContent='Sign in';}
});
</script>
</body>
</html>
